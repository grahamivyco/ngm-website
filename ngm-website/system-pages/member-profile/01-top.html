<!-- Canonical page markup — paste into a WA Custom-HTML gadget at the TOP of
     the /Sys/Profile system page, REPLACING the "Contact Profile" Headline
     gadget (delete that gadget — its red "Click EDIT PROFILE" arrow goes with
     it). Styling comes from the .ngm-sys block in global-css/global.css
     (already live site-wide; no CSS changes needed). -->
<div class="ngm-sys">
  <section class="ngm-sys-band">
    <div class="ngm-sys-inner">
      <span class="ngm-sys-eyebrow">Member account</span>
      <h1 class="ngm-sys-title">My <em>profile</em></h1>
      <p class="ngm-sys-sub">Your membership, contact details, event registrations, invoices, and email preferences &mdash; review and update them any time.</p>
    </div>
  </section>
</div>
<script>
/* NGM — mobile tab dropdown for the profile. Builds a <select> from WA's
   ul.memberDetailsTabMenu; picking an option clicks the real tab link, so
   WA's postback navigation keeps working. CSS shows the select and hides
   the tab bar under 700px; desktop keeps the underline tabs. Guarded so a
   missing tab bar just means nothing happens. */
(function () {
  function buildTabSelect() {
    var menu = document.querySelector('.WaGadgetContactProfile ul.memberDetailsTabMenu');
    if (!menu || document.getElementById('ngm-prof-tabselect')) return;
    var items = menu.querySelectorAll('li');
    var links = [];
    var select = document.createElement('select');
    select.id = 'ngm-prof-tabselect';
    select.className = 'ngm-prof-tabselect';
    select.setAttribute('aria-label', 'Profile section');
    for (var i = 0; i < items.length; i++) {
      var a = items[i].querySelector('a');
      var span = items[i].querySelector('span');
      var visibleSpan = span && (span.getAttribute('style') || '').indexOf('none') === -1;
      var label = ((visibleSpan ? span : a) || {}).textContent || '';
      label = label.replace(/\s+/g, ' ').trim();
      if (!label) continue;               /* hidden tab (edit mode) — skip */
      var opt = document.createElement('option');
      opt.value = String(links.length);
      opt.textContent = label;
      if (visibleSpan) opt.selected = true;   /* current tab */
      links.push(a);
      select.appendChild(opt);
    }
    if (select.options.length < 2) return;
    select.addEventListener('change', function () {
      var a = links[parseInt(select.value, 10)];
      if (a) a.click();
    });
    var tabLabel = document.createElement('span');
    tabLabel.className = 'ngm-prof-tablabel';
    tabLabel.textContent = 'Profile section';
    menu.parentNode.insertBefore(tabLabel, menu);
    menu.parentNode.insertBefore(select, menu);
    /* Balance reads as its own line under the dropdown/tabs */
    var bal = document.querySelector('.WaGadgetContactProfile .totalBalance');
    if (bal) menu.parentNode.insertBefore(bal, menu);

    /* Collapse to the dropdown the moment the tabs can't fit the row —
       at ANY width, not a fixed breakpoint. The needed width is the sum
       of the visible tabs plus the flex gap, measured while visible. */
    var needed = 0;
    function measure() {
      var w = 0, visible = 0;
      var lis = menu.querySelectorAll('li');
      for (var j = 0; j < lis.length; j++) {
        if (lis[j].offsetParent !== null && lis[j].offsetWidth > 0) {
          w += lis[j].offsetWidth; visible++;
        }
      }
      if (visible) needed = w + 24 * (visible - 1) + 2;
    }
    function update() {
      var available = (menu.parentNode || menu).clientWidth;
      if (needed > available) {
        menu.classList.add('ngm-tabs-collapsed');
        select.classList.add('ngm-tabselect-on');
        tabLabel.classList.add('ngm-tabselect-on');
      } else {
        menu.classList.remove('ngm-tabs-collapsed');
        select.classList.remove('ngm-tabselect-on');
        tabLabel.classList.remove('ngm-tabselect-on');
      }
    }
    measure(); update();
    window.addEventListener('resize', function () {
      if (!menu.classList.contains('ngm-tabs-collapsed')) measure();
      update();
    });
  }
  /* WA renders edit-mode Cancel as a bare submit with no onclick, so the
     form's client validation can silently swallow the click. Make Cancel
     deterministic: go straight back to view mode (keeping ?memberId= when
     an admin is viewing someone else's profile). View mode has no
     [value="Cancel"] buttons, so this wires nothing there. */
  function fixCancel() {
    var cancels = document.querySelectorAll('.WaGadgetContactProfile input.typeButton[value="Cancel"]');
    for (var c = 0; c < cancels.length; c++) {
      cancels[c].addEventListener('click', function (ev) {
        ev.preventDefault();
        window.location.href = '/Sys/Profile/' + window.location.search;
      });
    }
  }
  function run() {
    try { buildTabSelect(); } catch (e) { /* leave tabs as-is */ }
    try { fixCancel(); } catch (e) { /* leave WA behavior */ }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
