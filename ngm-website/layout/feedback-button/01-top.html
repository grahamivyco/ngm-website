<!--
╔══════════════════════════════════════════════════════════════╗
║  NGM FEEDBACK BUTTON — floating, site-wide (PRODUCTION)      ║
║                                                              ║
║  A small pill that floats in the bottom-right on EVERY page  ║
║  and EVERY viewport, linking to a Google Form where visitors ║
║  can share opinions or report bugs about the site refresh.   ║
║  The form is wired to a Google Sheet so responses are        ║
║  tracked (and viewable) in one place.                        ║
║                                                              ║
║  HOW TO PUBLISH:                                             ║
║  Paste this ENTIRE block into a Custom HTML gadget in the    ║
║  site-wide page template (same template that holds the       ║
║  header/footer) so it shows on every page. It is             ║
║  position:fixed, so it floats regardless of where the        ║
║  gadget sits in the layout.                                  ║
║                                                              ║
║  ►►► ONE THING TO EDIT ◄◄◄                                   ║
║  Replace the href below (marked FEEDBACK FORM URL) with the  ║
║  share link of your Google Form, e.g. https://forms.gle/xxxx ║
║  To make the form feed a Sheet: open the Form → Responses    ║
║  tab → "Link to Sheets" → Create new spreadsheet.            ║
╚══════════════════════════════════════════════════════════════╝
-->
<style>
#ngmfb,#ngmfb *,#ngmfb *::before,#ngmfb *::after{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1}
/* ── The floating pill ──
   z-index sits just BELOW the header (2147483000) so that when the mobile
   menu opens full-screen, its scrim covers this button instead of it poking
   through. Safe-area insets keep it clear of the iOS home indicator. */
#ngmfb{
  position:fixed;
  right:calc(20px + env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:2147482500;
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:12px 18px;
  background:#C7D4B6;
  color:#35472F;
  border:1px solid #AEBF96;
  border-radius:100px;
  text-decoration:none;
  font-size:.875rem;
  font-weight:600;
  letter-spacing:.01em;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(36,36,36,.16),0 1px 3px rgba(36,36,36,.12);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;
}
#ngmfb:hover{
  background:#BCCBA7;
  border-color:#9FB283;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(62,85,56,.22),0 2px 6px rgba(36,36,36,.14);
}
#ngmfb:focus-visible{outline:2px solid #B87260;outline-offset:3px}
#ngmfb .ngmfb-ico{width:18px;height:18px;flex-shrink:0;display:block}
/* The little accent dot in the icon reads as "new" / attention. */
#ngmfb .ngmfb-txt-short{display:none}
/* On narrow screens the label shortens so the pill stays small. */
@media(max-width:560px){
  #ngmfb{
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    padding:11px 15px;
    font-size:.8125rem;
    gap:7px;
  }
  #ngmfb .ngmfb-ico{width:17px;height:17px}
  #ngmfb .ngmfb-txt-full{display:none}
  #ngmfb .ngmfb-txt-short{display:inline}
}
@media(prefers-reduced-motion:reduce){
  #ngmfb{transition:none}
  #ngmfb:hover{transform:none}
}
</style>
<!-- ►►► FEEDBACK FORM URL — replace the href with your Google Form share link ◄◄◄ -->
<a id="ngmfb"
   href="https://forms.gle/REPLACE-WITH-YOUR-GOOGLE-FORM-LINK"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Share website feedback and ideas — opens a feedback form in a new tab">
  <svg class="ngmfb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5"/>
  </svg>
  <span class="ngmfb-txt-full">Website Feedback &amp; Ideas</span>
  <span class="ngmfb-txt-short">Feedback</span>
</a>
<script>
/* ── Dock above the footer ──
   The pill is position:fixed, so by default it floats over whatever is at the
   bottom of the viewport — including the footer once you scroll to the bottom.
   This lifts it to rest JUST ABOVE the footer when the footer scrolls into
   view, and lets it float normally (CSS bottom + safe-area) otherwise.
   If no footer (#ngmf) is on the page, the CSS default is left untouched. */
(function(){
  'use strict';
  var btn=document.getElementById('ngmfb');
  if(!btn)return;
  var MARGIN=20;              /* gap kept between the pill and the footer top */
  var ticking=false;
  function reposition(){
    ticking=false;
    var footer=document.getElementById('ngmf');
    if(!footer){btn.style.bottom='';return;}
    var vh=window.innerHeight||document.documentElement.clientHeight;
    var footerTop=footer.getBoundingClientRect().top;
    var showing=vh-footerTop;               /* px of footer visible at the bottom */
    if(showing>0){
      btn.style.bottom=(showing+MARGIN)+'px';   /* sit just above the footer */
    }else{
      btn.style.bottom='';                       /* revert to CSS (with safe-area) */
    }
  }
  function onScroll(){if(!ticking){requestAnimationFrame(reposition);ticking=true;}}
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  window.addEventListener('load',reposition);
  reposition();
}());
</script>
