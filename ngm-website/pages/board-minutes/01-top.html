<!-- Canonical page markup — this is the file to edit and to paste into the WA Custom-HTML gadget. Styling lives in global-css/global.css (pasted into the WA CSS tab; must be live in WA first). There is no separate self-contained version. -->
<!-- ══ THIS IS THE ONLY CUSTOM-HTML GADGET ON THE PAGE ═══════════════
     Structure: this gadget, then the native WA CONTENT gadgets holding
     the lists. NOTHING sits underneath them — the way back to the
     Member Hub is in the hero below.

     Each content gadget carrying the ngm-wa-minutes class becomes its
     own card: the script at the bottom reads its heading and rebuilds
     it as a styled title. Everything is visible — there is no
     collapsing and nothing to click to reveal a list.

     Everything in THIS file is chrome. Don't put meeting dates here.
══════════════════════════════════════════════════════════════════ -->
<div class="ngm ngm-min-hero">
  <div class="ngm-min-hero-inner">
    <span class="ngm-eyebrow">Meeting minutes</span>
    <h1 class="ngm-h1">Board &amp; annual <em>meeting minutes</em></h1>
    <p class="ngm-lead">What the board discussed and decided, meeting by meeting &mdash; board, executive board and the annual meeting, grouped by year. Open to current members.</p>
    <div class="ngm-min-hero-back">
      <a class="ngm-btn ngm-btn-outline" href="/member-hub">Back to the Member Hub</a>
    </div>
  </div>
</div>

<section class="ngm ngm-sec ngm-sec-linen ngm-min-head">
  <div class="ngm-con">
    <p class="ngm-lead">Newest first. Each meeting opens as a PDF.</p>
  </div>
</section>
<script>
/* ── MINUTES CARDS ──────────────────────────────────────────────────
   Turns every native content gadget carrying the ngm-wa-minutes class
   into a styled card. Nothing collapses; everything is visible.

   WHY THE TITLE IS REBUILT RATHER THAN STYLED: the old page's headings
   render bold sans however they are targeted in CSS — the content
   carries inline font markup that outranks a rule aimed at the heading,
   and on some blocks the heading sits in a gadget of its own, where a
   rule scoped to .ngm-wa-minutes never reaches it at all. So this reads
   the heading's TEXT, hides the original, and builds its own button.
   Nothing downstream has to guess at the editor's markup.

   Idempotent — safe if WA runs it twice. */
(function () {
  function text(el) {
    return ((el && el.textContent) || "").replace(/ /g, " ").replace(/\s+/g, " ").trim();
  }

  /* Never read a title out of UI this script built. Without this, the
     backward walk below could land on an already-built card and take
     its BUTTON text — title plus count, run together — which is how a
     card came out reading "Board Meeting Minutes 20250 meetings". */
  function ours(el) {
    return !!(el && (el.classList.contains("ngm-min-sec") ||
                     el.classList.contains("ngm-min-title") ||
                     el.classList.contains("ngm-min-src") ||
                     (el.querySelector && el.querySelector(".ngm-min-title, .ngm-min-sec"))));
  }

  /* The heading for this gadget: the first thing with text before the
     list, or — when the heading is its own gadget — the nearest block
     above that has text and no list of its own. */
  function findTitle(gadget, body, list) {
    for (var n = body.firstElementChild; n && n !== list; n = n.nextElementSibling) {
      if (!ours(n) && text(n)) return n;
    }
    var prev = gadget.previousElementSibling, hops = 0;
    while (prev && hops++ < 3) {
      if (prev.querySelector && prev.querySelector("li")) break;   /* another block's list */
      if (ours(prev)) break;                                       /* our own card — stop */
      if (text(prev) && text(prev).length < 120) return prev;
      prev = prev.previousElementSibling;
    }
    return null;
  }

  /* For the second and later pairs in one box, the heading is just the
     block immediately above the list. */
  function prevTitle(list) {
    var n = list.previousElementSibling;
    while (n && (ours(n) || !text(n))) {
      if (ours(n)) return null;
      n = n.previousElementSibling;
    }
    return n && !n.querySelector("li") ? n : null;
  }

  /* A row may name what kind of meeting it was, after a dash:
       7 April 2025 — Executive Board
     Sections group by YEAR now, so the heading no longer carries that;
     without this the kind would simply be lost. The editor types plain
     text and this lifts the tail into a chip.

     ⚠ IT MUST NOT MATTER WHERE THE LINK ENDS. Whoever types these
     selects some text and links it, and which text they select is not
     something a how-to can reliably control. Both happen:
       <a>7 April 2025 — Executive Board</a>     whole line linked
       <a>7 April 2025</a> — Executive Board     only the date linked
     An earlier version only handled the first and silently left the
     second as a raw dash. Both are handled below, so the instruction
     can stay "type a dash and the kind" with nothing about selecting. */
  var SEP = /\s*[\u2014\u2013\u00b7]\s*|\s+-\s+/;
  var LEAD_SEP = /^\s*(?:[\u2014\u2013\u00b7]|-)\s*/;

  function addChip(parent, label) {
    var chip = document.createElement("span");
    chip.className = "ngm-min-kind";
    chip.textContent = label;
    parent.appendChild(chip);
  }

  /* Hide the editor's own heading once its text has been read, and
     collapse the gadget it came from if that leaves it empty. */
  function hideSource(src) {
    if (!src) return;
    src.classList.add("ngm-min-src");
    var host = src.closest ? src.closest(".WaGadget") : null;
    if (host && !host.classList.contains("ngm-wa-minutes") && !text(host)) {
      host.classList.add("ngm-wa-minutes-src-empty");
    }
  }

  function titleEl(label, count) {
    var head = document.createElement("h2");
    head.className = "ngm-min-title";
    head.innerHTML = '<span class="ngm-min-title-txt"></span>' +
                     '<span class="ngm-min-count"></span>';
    head.querySelector(".ngm-min-title-txt").textContent = label;
    head.querySelector(".ngm-min-count").textContent =
      count ? count + (count === 1 ? " meeting" : " meetings") : "";
    return head;
  }

  function chipify(row) {
    if (row.getAttribute("data-min-chip") === "1") return;
    row.setAttribute("data-min-chip", "1");
    var a = row.querySelector("a");

    /* the label sits INSIDE the link */
    if (a && SEP.test(text(a))) {
      var bits = text(a).split(SEP);
      var tail = bits.slice(1).join(" ").trim();
      if (!tail || tail.length > 40) return;
      a.textContent = bits[0].trim();
      addChip(a, tail);
      return;
    }

    /* the label TRAILS the link as bare text */
    if (a) {
      var trailing = "", n = a.nextSibling, spent = [];
      while (n) { trailing += n.textContent || ""; spent.push(n); n = n.nextSibling; }
      trailing = trailing.replace(LEAD_SEP, "").replace(/\s+/g, " ").trim();
      if (!trailing || trailing.length > 40) return;
      spent.forEach(function (node) { node.parentNode.removeChild(node); });
      addChip(row, trailing);
      return;
    }

    /* no link at all — the row is plain text (minutes not posted yet) */
    var raw = text(row);
    if (!SEP.test(raw)) return;
    var parts = raw.split(SEP);
    var label = parts.slice(1).join(" ").trim();
    if (!label || label.length > 40) return;
    row.textContent = parts[0].trim();
    addChip(row, label);
  }

  /* One section per heading+list PAIR, not per gadget. One box per
     block is the intended arrangement, but a volunteer will eventually
     type a second heading and list into an existing box — and when that
     happened the second pair rendered raw. Handling every pair means
     the page degrades sensibly instead. */
  function build(allowEmpty) {
    var gadgets = document.querySelectorAll(".ngm-wa-minutes");
    Array.prototype.forEach.call(gadgets, function (g) {
      var body = g.querySelector(".gadgetStyleBody") || g;
      var lists = body.querySelectorAll("ul, ol");

      /* A YEAR WITH NOTHING IN IT YET. The WA editor drops an empty
         bullet, so a box put up as a placeholder ends up as a heading
         and no list at all. Without this the heading rendered as raw
         bold text on the linen — the opposite of the point. Only on a
         settled pass, for the same reason empty lists are: early on,
         "no list" is indistinguishable from "WA hasn't rendered it". */
      if (!lists.length) {
        if (!allowEmpty || body.querySelector(".ngm-min-sec")) return;
        var only = findTitle(g, body, null);
        if (!only || !text(only)) return;
        hideSource(only);
        var blank = document.createElement("div");
        blank.className = "ngm-min-sec";
        blank.appendChild(titleEl(text(only), 0));
        var note = document.createElement("p");
        note.className = "ngm-min-none";
        note.textContent = "Nothing posted for this year yet.";
        blank.appendChild(note);
        body.appendChild(blank);
        return;
      }

      Array.prototype.forEach.call(lists, function (list, i) {
        if (list.closest(".ngm-min-sec")) return;       /* already built, or nested */
        /* Done-ness is tracked per LIST, not per gadget: WA can render a
           gadget before its rows exist, and marking the gadget finished
           there left an empty card that never filled in.
           An empty list is therefore AMBIGUOUS — a year with nothing
           posted yet, or one WA hasn't filled in. So it's skipped on the
           early passes and only built once things have settled
           (allowEmpty), which keeps a genuinely empty year visible
           without reintroducing that bug. */
        var count = list.querySelectorAll("li").length;
        if (!count && !allowEmpty) return;
        var src = i === 0 ? findTitle(g, body, list) : prevTitle(list);
        var label = text(src) || "Minutes";
        hideSource(src);

        var sec = document.createElement("div");
        sec.className = "ngm-min-sec";
        /* A heading, not a button — nothing collapses. */
        var head = titleEl(label, count);

        list.parentNode.insertBefore(sec, list);
        sec.appendChild(head);
        sec.appendChild(list);

        if (!count) {
          var none = document.createElement("p");
          none.className = "ngm-min-none";
          none.textContent = "Nothing posted for this year yet.";
          sec.appendChild(none);
        }

        /* pull any "— Executive Board" tail out into a chip */
        Array.prototype.forEach.call(list.querySelectorAll("li"), function (row) {
          chipify(row);
        });
      });
    });
  }

  function init() {
    /* The cards sit on a linen band, but on a tall viewport with little
       content the page ran out before the footer and the theme's own
       background showed underneath. Flag the body so the CSS can paint
       WA's content wrappers linen too — same approach the member
       directory uses for its cream page. */
    if (document.body) document.body.classList.add("ngm-min-page");
    build(false);
    /* WA can render gadgets late; catch them if it does */
    if (window.MutationObserver) {
      var mo = new MutationObserver(function () { build(false); });
      mo.observe(document.body, { childList: true, subtree: true });
      setTimeout(function () { mo.disconnect(); build(true); }, 8000);
    }
    /* once rendering has settled, show any year that really is empty */
    setTimeout(function () { build(true); }, 2000);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }
})();
</script>
