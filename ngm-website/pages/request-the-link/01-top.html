<!-- Canonical page markup — this is the file to edit and to paste into the WA Custom-HTML gadget. Styling lives in global-css/global.css (pasted into the WA CSS tab; must be live in WA first). There is no separate self-contained version.

     PAGE STRUCTURE (3 gadgets, top to bottom):
       1. This Custom-HTML gadget — the hero/intro.
       2. The 02-form.html Custom-HTML gadget — the branded NGM request form.
          It posts to a HIDDEN Google Form; an Apps Script auto-emails the Zoom
          link. Visitors only ever see our form, never Google. The link lives
          in the script, not on the page, so it stays private. Full setup (make
          the Google Form, get the entry ids, paste the Apps Script) is in
          README.md. (Board decision, Jul 2026: auto-send, to save handling
          inquiry emails.)
       3. The 03-bottom.html Custom-HTML gadget — a "members already have it"
          band (Member Hub button) + the Join CTA. (No "what happens next" note:
          the form swaps to its own "Check your inbox" state on submit.)
-->
