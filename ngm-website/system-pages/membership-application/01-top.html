<!-- Canonical page markup — this is the file to edit and to paste into the WA Custom-HTML gadget. Styling lives in global-css/global.css (pasted into the WA CSS tab; must be live in WA first). There is no separate self-contained version. -->
<div class="ngm-sys">
  <section class="ngm-sys-band">
    <div class="ngm-sys-inner">
      <span class="ngm-sys-eyebrow">Membership</span>
      <h1 class="ngm-sys-title">Join the <em>Guild</em></h1>
      <p class="ngm-sys-sub">Annual Guild Membership is $30 a year and runs June 1 through May 31. Fill in the short form below to apply — welcome to the Guild.</p>
    </div>
  </section>
</div>
<script>
/* NGM — review-step layout fixes for the WA membership wizard. CSS alone
   can't reorder these blocks reliably (WA's wrapper nesting varies), so the
   DOM is adjusted here instead. Each wizard step is a full page load, so this
   runs fresh on every step; everything is guarded so other steps and future
   WA markup changes just no-op. */
(function () {
  function fixReviewStep() {
    var gadget = document.querySelector('.WaGadgetMembershipApplication');
    if (!gadget || !/StateReview/.test(gadget.className)) return;

    /* Back → "Edit", and its row moves ABOVE the Review-and-confirm tile */
    var box = gadget.querySelector('.commonMessageBox');
    var back = gadget.querySelector('input[id$="_prevTop"], input[id$="_prev"]');
    if (back && box) {
      back.value = 'Edit';
      var backRow = back.closest('.right') || back;
      var boxWrap = box.closest('[id$="_infoMessageBox"]') || box;
      boxWrap.parentNode.insertBefore(backRow, boxWrap);
      backRow.style.margin = '0 0 10px';
    }

    /* Cancel row moves BELOW the Application data (after the last field row) */
    var cancel = gadget.querySelector('input[id$="_cancelTop"], input[id$="_cancel"]');
    var fields = gadget.querySelectorAll('.fieldContainer');
    if (cancel && fields.length) {
      var cancelRow = cancel.closest('.left') || cancel;
      var last = fields[fields.length - 1];
      if (last.parentNode) {
        last.parentNode.appendChild(cancelRow);
        cancelRow.style.cssText += ';margin:32px 0 0;display:flex;justify-content:center;float:none;width:auto;';
      }
    }

    /* Section title above the payment options */
    var firstCard = gadget.querySelector('.payment-method-card');
    if (firstCard && !document.getElementById('ngm-pay-head')) {
      var head = document.createElement('div');
      head.id = 'ngm-pay-head';
      head.className = 'ngm-pay-head';
      var eb = document.createElement('span');
      eb.className = 'ngm-pay-eyebrow';
      eb.textContent = 'Payment';
      var t = document.createElement('span');
      t.className = 'ngm-pay-title';
      t.textContent = 'How would you like to pay?';
      head.appendChild(eb); head.appendChild(t);
      firstCard.parentNode.insertBefore(head, firstCard);
    }

    /* Card copy: plain titles, the PayPal note folded into the description */
    var cardH3 = gadget.querySelector('label[for="creditCardRadio"] h3');
    if (cardH3) cardH3.textContent = 'Credit or debit card';
    function appendDesc(btnSel, marker, text) {
      var btn = gadget.querySelector(btnSel);
      var card = btn && btn.closest('.payment-method-card');
      var desc = card && card.querySelector('.payment-method-description');
      if (desc && desc.textContent.indexOf(marker) === -1) {
        var d = document.createElement('div');
        d.textContent = text;
        desc.appendChild(d);
      }
    }
    appendDesc('input[id$="_btnPayWithCard"]', 'PayPal',
      'Secure checkout through PayPal.');
    appendDesc('input[id$="_btnInvoiceMe"]', 'invoice with payment',
      "Prefer to pay by check? Choose this option and we'll email you an invoice with payment instructions.");
  }
  function run() { try { fixReviewStep(); } catch (e) { /* leave WA layout as-is */ } }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
