     secretary adds a set of minutes in the ordinary WA editor: type the
     date, select it, insert the link to the PDF. No HTML, no repo, no
     paste step. See 02-wa-gadget.txt.

<div class="ngm ngm-min-hero">
  <div class="ngm-min-hero-inner">
    <span class="ngm-eyebrow">Members only</span>
    <h1 class="ngm-h1">Board <em>minutes</em></h1>
    <p class="ngm-lead">What the board discussed and decided, meeting by meeting. Open to current members.</p>
  </div>
</div>

    <p class="ngm-lead">Newest first. Each set opens as a PDF.</p>
  </div>
</section>
