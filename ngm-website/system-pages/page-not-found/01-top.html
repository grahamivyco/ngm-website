<!-- Canonical page markup — this is the file to edit and to paste into the WA Custom-HTML gadget. Styling lives in global-css/global.css (pasted into the WA CSS tab; must be live in WA first). There is no separate self-contained version. -->
<div class="ngm-sys">
  <section class="ngm-sys-band ngm-sys-fill">
    <div class="ngm-sys-inner">
      <span class="ngm-sys-eyebrow">Error 404</span>
      <h1 class="ngm-sys-title">This page slipped a <em>stitch</em></h1>
      <p class="ngm-sys-sub">The page you&rsquo;re looking for may have moved or no longer exists. Let&rsquo;s get you back on track.</p>
      <div class="ngm-sys-btns">
        <a class="ngm-sys-btn ngm-sys-btn-green" href="/">Back to home</a>
        <a class="ngm-sys-btn ngm-sys-btn-outline" href="/calendar">Browse the calendar</a>
      </div>
    </div>
  </section>
</div>
<script>
/* FILL THE SCREEN — the 404 band is the page's only content, so at its
   natural height the whole page came up SHORTER than the window and left a
   band of empty background under the footer. The band takes up the rest of
   the screen instead:
     innerHeight - #ngm (fixed header) - a peek of the footer
   The peek is deliberate: filling the exact gap down to the footer's TOP
   would put the entire footer on screen, and the page should end with just
   the start of it showing (the rest arrives on scroll). It's ~14% of the
   window, floored at 110px and capped at 190px so it stays a glimpse on
   both short laptops and tall monitors — and never taller than the footer
   itself. The header is measured rather than hard-coded because it shrinks
   at mobile; remeasure on resize, on load, and whenever it changes size. */
(function () {
  var band = document.querySelector(".ngm-sys-fill");
  if (!band) return;
  function fit() {
    var head = document.getElementById("ngm");
    var foot = document.getElementById("ngmf");
    var h = head ? head.getBoundingClientRect().height : 0;
    var f = foot && foot.offsetParent !== null ? foot.getBoundingClientRect().height : 0;
    var peek = Math.min(Math.max(110, window.innerHeight * 0.14), 190);
    if (f) peek = Math.min(peek, f);
    band.style.setProperty("--ngm-sys-fill", Math.max(0, window.innerHeight - h - peek) + "px");
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  if (window.ResizeObserver) {
    var ro = new ResizeObserver(fit);
    var watch = function () {
      var foot = document.getElementById("ngmf");
      var head = document.getElementById("ngm");
      if (foot) ro.observe(foot);
      if (head) ro.observe(head);
      return !!foot;
    };
    /* the footer gadget may render after this script; poll briefly for it */
    if (!watch()) {
      var n = 0, t = setInterval(function () {
        if (watch() || ++n > 30) clearInterval(t);
      }, 100);
    }
  }
})();
</script>
