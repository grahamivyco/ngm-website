<style>#ngmfb,#ngmfb *,#ngmfb *::before,#ngmfb *::after{box-sizing:border-box;margin:0;padding:0;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1}

#ngmfb{
  position:fixed;
  right:calc(20px + env(safe-area-inset-right,0px));
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  z-index:2147482500;
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:12px 18px;
  background:#C7D4B6;
  color:#35472F;
  border:1px solid #AEBF96;
  border-radius:100px;
  text-decoration:none;
  font-size:.875rem;
  font-weight:600;
  letter-spacing:.01em;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(36,36,36,.16),0 1px 3px rgba(36,36,36,.12);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;
}
#ngmfb:hover{
  background:#BCCBA7;
  border-color:#9FB283;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(62,85,56,.22),0 2px 6px rgba(36,36,36,.14);
}
#ngmfb:focus-visible{outline:2px solid #B87260;outline-offset:3px}
#ngmfb .ngmfb-ico{width:18px;height:18px;flex-shrink:0;display:block}

#ngmfb .ngmfb-txt-short{display:none}

@media(max-width:560px){
  #ngmfb{
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    padding:11px 15px;
    font-size:.8125rem;
    gap:7px;
  }
  #ngmfb .ngmfb-ico{width:17px;height:17px}
  #ngmfb .ngmfb-txt-full{display:none}
  #ngmfb .ngmfb-txt-short{display:inline}
}
@media(prefers-reduced-motion:reduce){
  #ngmfb{transition:none}
  #ngmfb:hover{transform:none}
}
</style>

<a id="ngmfb"
   href="https://forms.gle/BPz9eZNpCSxLpEmNA"
   target="_blank"
   rel="noopener noreferrer"
   aria-label="Share website feedback and ideas — opens a feedback form in a new tab">
  <svg class="ngmfb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
  </svg>
  <span class="ngmfb-txt-full">Feedback &amp; Ideas</span>
  <span class="ngmfb-txt-short">Ideas</span>
</a>
<script>(function(){
  'use strict';
  var btn=document.getElementById('ngmfb');
  if(!btn)return;
  var MARGIN=20;              
  var ticking=false;
  function reposition(){
    ticking=false;
    var footer=document.getElementById('ngmf');
    if(!footer){btn.style.bottom='';return;}
    var vh=window.innerHeight||document.documentElement.clientHeight;
    var footerTop=footer.getBoundingClientRect().top;
    var showing=vh-footerTop;               

    if(showing>0&&showing<vh-72){
      btn.style.bottom=(showing+MARGIN)+'px';   
    }else{
      btn.style.bottom='';                       
    }
  }
  function onScroll(){if(!ticking){requestAnimationFrame(reposition);ticking=true;}}
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  window.addEventListener('load',reposition);
  reposition();
}());
</script>
