<!-- Canonical page markup — this is the file to edit and to paste into the WA Custom-HTML gadget. Styling lives in global-css/global.css (pasted into the WA CSS tab; must be live in WA first). There is no separate self-contained version. -->
<div class="ngm">
  <section class="ngm-login-hero">
    <div class="ngm-login-hero-inner">
      <span class="ngm-lh-eyebrow">Log In</span>
      <h1 class="ngm-lh-title">Welcome back, <br><em>stitchers</em></h1>
      <p class="ngm-lh-sub">Sign in to your Needlework Guild account to register for monthly
        meetings and events, browse the member directory, and open members-only
        patterns and resources.</p>
    </div>
  </section>
</div>
<!-- The native WA login form gadget is added next (02-wa-gadget.txt),
     then 03-bottom.html follows — both sit in the right half via Global CSS. -->
<script>
  document.body.classList.add('ngm-login-page');
  /* /Sys/Login + authorization-required: the native auth form ships its
     "Email"/"Password" labels above the fields and no placeholders. The
     labels are hidden by global.css to match the /log-in form, so give the
     inputs the same in-field placeholder labels here. */
  (function () {
    function ngmAuthPlaceholders() {
      var g = document.querySelector('.WaGadgetAuthorizationRequired');
      if (!g) return;
      var e = g.querySelector('input[name="email"]');
      if (e && !e.placeholder) e.placeholder = 'Email';
      var p = g.querySelector('input[name="password"]');
      if (p && !p.placeholder) p.placeholder = 'Password';
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', ngmAuthPlaceholders);
    } else {
      ngmAuthPlaceholders();
    }
  }());
</script>
