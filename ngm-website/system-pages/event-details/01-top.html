<!-- Canonical page markup — paste into the Custom-HTML gadget ABOVE the native
     Event details gadget on the WA "Event details" system page. Styling lives in
     global-css/global.css. -->
<!-- No visible markup here any more: the button row under the event title
     (primary pill -> calendar, outline pill -> the event/meeting type's
     page) is injected by the script below, replacing the old top pill. -->
<script>
/* TITLE BUTTON ROW — Guild event titles follow "Group Name: topic". Under
   the title we inject a pill-button row: PRIMARY (filled sage) back to the
   full calendar, and when the title matches a known group/event type, a
   SECONDARY (outline) "More about ..." pill to that type's page. First
   match wins (order matters: "Daytime Counted Thread" must beat plain
   "Stitch-In"). Unmatched titles just get the calendar pill. Idempotent. */
(function () {
  var TYPES = [
    ["daytime counted thread", "/daytime-counted-thread", "Daytime Counted Thread & Needlepoint"],
    ["counted thread",         "/daytime-counted-thread", "Daytime Counted Thread & Needlepoint"],
    ["daytime stitch-in",      "/daytime-stitch-in",      "the Daytime Stitch-In"],
    ["evening stitch-in",      "/Evening-Stitch-In",      "the Evening Stitch-In"],
    ["sunday tea",             "/Sunday-Tea-Stitch",      "Sunday Tea & Stitch"],
    ["come & stitch",          "/Come-&-Stitch",          "Come & Stitch"],
    ["come and stitch",        "/Come-&-Stitch",          "Come & Stitch"],
    ["potpourri",              "/potpourri",              "Potpourri Stitchers"],
    ["japanese embroidery",    "/japanese-embroidery",    "Traditional Japanese Embroidery"],
    ["march to the finish",    "/march-to-the-finish",    "March to the Finish"],
    ["fall finish",            "/fall-finish",            "A Fall Finish"],
    ["retreat",                "/retreat",                "the Annual Retreat"],
    ["workshop",               "/workshops",              "Workshops"],
    ["5th tuesday",            "/5th-tuesday",            "5th Tuesday Open Stitching"],
    ["fifth tuesday",          "/5th-tuesday",            "5th Tuesday Open Stitching"]
  ];
  function inject() {
    var h1 = document.querySelector(".WaGadgetEventsStateDetails h1.pageTitle");
    if (!h1 || document.querySelector(".ngm-evd-btns")) return;
    var row = document.createElement("div");
    row.className = "ngm-evd-btns";
    var cal = document.createElement("a");
    cal.className = "ngm-btn ngm-btn-green ngm-btn-sm";
    cal.href = "/calendar";
    cal.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to the full calendar';
    row.appendChild(cal);
    var title = (h1.textContent || "").toLowerCase();
    for (var i = 0; i < TYPES.length; i++) {
      if (title.indexOf(TYPES[i][0]) > -1) {
        var a = document.createElement("a");
        a.className = "ngm-btn ngm-btn-outline ngm-btn-sm";
        a.href = TYPES[i][1];
        a.textContent = "More about " + TYPES[i][2];
        row.appendChild(a);
        break;
      }
    }
    h1.parentNode.insertBefore(row, h1.nextSibling);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", inject);
  } else {
    inject();
  }
})();
</script>
